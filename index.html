<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلتنا سوا ❤️</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0c20;
            --card-bg: rgba(255, 255, 255, 0.07);
            --primary-pink: #ff2a6d;
            --accent-gold: #ffd700;
            --glow-color: rgba(255, 42, 109, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0b091a 0%, #1a0f2e 50%, #2a0826 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Floating Background Particles */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 42, 109, 0.15);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
            bottom: -30px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        /* Main Container */
        .app-container {
            width: 90%;
            max-width: 450px;
            min-height: 520px;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Envelope / Intro Section */
        .envelope-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 42, 109, 0.2);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseGlow 3s infinite alternate;
            width: 100%;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 25px 60px rgba(255, 42, 109, 0.4);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255, 42, 109, 0.2); }
            100% { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(255, 42, 109, 0.5); }
        }

        .envelope-icon {
            font-size: 85px;
            display: inline-block;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 42, 109, 0.6));
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .envelope-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .envelope-hint {
            font-size: 0.95rem;
            color: #ffb3c6;
            letter-spacing: 0.5px;
        }

        /* Card / Pages Section */
        .card-page {
            display: none;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.05);
            animation: fadeIn 0.6s ease forwards;
            position: relative;
        }

        .card-page.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 520px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Typography & Styles */
        .ruqaa-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.2rem;
            color: #ffd700;
            line-height: 1.5;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .ruqaa-love {
            font-family: 'Aref Ruqaa', serif;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff2a6d;
            text-shadow: 0 0 20px #ff2a6d, 0 0 40px rgba(255, 42, 109, 0.6);
            margin: 20px 0;
            letter-spacing: 2px;
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            from { text-shadow: 0 0 15px #ff2a6d, 0 0 30px rgba(255, 42, 109, 0.5); transform: scale(1); }
            to { text-shadow: 0 0 25px #ff2a6d, 0 0 50px rgba(255, 42, 109, 0.9), 0 0 70px #ff2a6d; transform: scale(1.05); }
        }

        .stylish-text {
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        /* Image Containers */
        .photo-card {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(255, 42, 109, 0.3);
            margin: 15px 0;
            max-height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 18px;
        }

        .dates-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .date-item {
            font-family: 'Cairo', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .date-number {
            color: #ffd700;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            direction: ltr;
        }

        .highlight-date {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2rem;
            color: #ffd700;
            background: rgba(255, 42, 109, 0.2);
            padding: 12px;
            border-radius: 18px;
            border: 1px dashed rgba(255, 215, 0, 0.5);
            margin: 15px 0;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        /* Buttons */
        .btn-action {
            background: linear-gradient(45deg, #ff2a6d, #ff5e62);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 42, 109, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: auto;
            position: relative;
            overflow: hidden;
        }

        .btn-action:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(255, 42, 109, 0.4);
        }

        /* Custom Rising Hearts Animation Container */
        .rising-heart {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 9999;
            font-size: 24px;
            animation: riseUp 3s ease-out forwards;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-110vh) scale(1.6) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="bg-hearts" id="bgHearts"></div>

    <div class="app-container">
        
        <!-- STEP 0: ENVELOPE INTRO -->
        <div class="envelope-wrapper" id="envelopeCard" onclick="openEnvelope()">
            <div class="envelope-icon">💌</div>
            <div class="envelope-title">وصلتك رسالة خاصة جداً</div>
            <div class="envelope-hint">اضغطي هنا علشان تفتحي الظرف ✨</div>
        </div>

        <!-- STEP 1: DATES & MEMORIES -->
        <div class="card-page" id="page1">
            <div>
                <div class="ruqaa-title">تواريخ محفورة في القلب 💫</div>
                
                <div class="dates-box">
                    <div class="date-item">
                        <span>🗓️</span>
                        <span class="date-number">10 / 10 / 2006</span>
                    </div>
                    <div class="date-item">
                        <span>✨</span>
                        <span class="date-number">8 / 10 / 2007</span>
                    </div>
                </div>

                <div class="photo-card">
                    <img src="https://i.ibb.co/L50F69W/photo1.jpg" alt="ذكرياتنا الجميلة">
                </div>
            </div>

            <button class="btn-action" onclick="nextPage(2)">يلا نروّح للخطوة الجاية 👈</button>
        </div>

        <!-- STEP 2: SPECIAL DATE & FLOWERS -->
        <div class="card-page" id="page2">
            <div>
                <div class="ruqaa-title">يوم مش زي أي يوم 🌹</div>
                
                <div class="highlight-date">
                    🗓️ يوم ٣ شهر ١
                </div>

                <div class="photo-card" style="max-height: 250px;">
                    <img src="https://i.ibb.co/30Z3SgV/photo2.jpg" alt="وردتنا الجميلة">
                </div>

                <p class="stylish-text" style="font-size: 1.1rem; color: #ffb3c6; margin-top: 5px;">
                    اليوم ده بالذات له مكانة تانية خالص جوة قلبي ❤️
                </p>
            </div>

            <button class="btn-action" onclick="nextPage(3)">التالي ✨</button>
        </div>

        <!-- STEP 3: MAIN QUESTION & FINAL LOVE -->
        <div class="card-page" id="page3">
            <div>
                <div class="ruqaa-title" style="font-size: 2rem; color: #ffffff;">
                    مستعدة نكمل الرحلة مع بعض؟ 💍✨
                </div>

                <p class="stylish-text" style="color: #ffb3c6; margin-top: 15px;">
                    يدي في يدك وعُمرنا كله سوا إن شاء الله ❤️
                </p>
            </div>

            <div>
                <button class="btn-action" id="completionBtn" onclick="triggerHeartsAndLove()">يلا كملي 💖</button>

                <!-- FINAL LOVE MESSAGE -->
                <div id="finalLoveMessage" style="display: none; margin-top: 20px; animation: fadeIn 1s ease forwards;">
                    <div class="ruqaa-love">بحبك ❤️</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Generate floating background hearts on load
        const bgHeartsContainer = document.getElementById('bgHearts');
        const heartSymbols = ['❤️', '💖', '💕', '💗', '💓', '✨'];
        
        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (5 + Math.random() * 6) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.style.fontSize = (15 + Math.random() * 20) + 'px';
            bgHeartsContainer.appendChild(heart);
        }

        // Navigation Functions
        function openEnvelope() {
            document.getElementById('envelopeCard').style.display = 'none';
            document.getElementById('page1').classList.add('active');
            createHeartBurst(15);
        }

        function nextPage(pageNumber) {
            document.querySelectorAll('.card-page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
            createHeartBurst(20);
        }

        // Burst of Rising Hearts Animation
        function createHeartBurst(count = 40) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'rising-heart';
                    heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = (5 + Math.random() * 90) + 'vw';
                    heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                    heart.style.animationDuration = (2 + Math.random() * 2.5) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4000);
                }, i * 80);
            }
        }

        // Final Button Action
        function triggerHeartsAndLove() {
            // Massive Heart Explosion
            createHeartBurst(80);

            // Confetti effect
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.8 },
                    colors: ['#ff2a6d', '#ffd700', '#ffffff', '#ffb3c6']
                });
            }

            // Hide the button smoothly and show "بحبك" in Ruqaa font
            const btn = document.getElementById('completionBtn');
            btn.style.transform = 'scale(0.9)';
            btn.style.opacity = '0.5';
            btn.innerText = 'أجمل رحلة سوا ❤️';
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('finalLoveMessage').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 300);
        }
    </script>
</body>
</html>
